<section class="content-header">
  <div class="card card-body">
    <div class="row">
      <div class="col-sm-8">
        <h1>
          {{header}}
          @if (subHeader) {
            <small>{{subHeader}}</small>
          }
        </h1>
      </div>

      <div class="col-sm-4 text-lg-end">

        <ol class="breadcrumb">
          @for (navItem of breadCrumbs; track navItem) {
            <li class="">
              @if (navItem.routeItems.length > 0) {
                <a
                  [routerLink]="navItem.routeItems"
                  class="breadcrumb-list-item small"
                >{{ navItem.linkText | uppercase}}</a>
              }
              @if (navItem.routeItems.length === 0) {
                <span class="small">&nbsp;{{navItem.linkText | uppercase}}</span>
              }
            </li>
          }
        </ol>

      </div>
    </div>
  </div>
</section>
