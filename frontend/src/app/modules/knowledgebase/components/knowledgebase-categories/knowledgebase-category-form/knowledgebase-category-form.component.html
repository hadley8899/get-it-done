<spinner [show]="loading"></spinner>
@if (!loading) {
  <form [formGroup]="knowledgebaseCategoryForm" (ngSubmit)="save()">
    @if (parentKnowledgebaseCategory) {
      <div class="alert alert-info">
        <i class="fa fa-info-circle"></i>
        Adding child to {{parentKnowledgebaseCategory.name}}
      </div>
    }
    <div class="mb-3">
      <label for="name" class="form-label">Name</label>
      <input type="text" class="form-control" id="name" placeholder="Knowledgebase Category Name..." formControlName="name">
    </div>
    <div class="mb-3">
      <label for="description" class="form-label">Description</label>
      <textarea type="text" class="form-control" id="description" placeholder="Knowledgebase Description..." formControlName="description"></textarea>
    </div>
    <button type="submit" class="btn btn-success" [disabled]="knowledgebaseCategoryForm.invalid || saving">
      <spinner [show]="saving"></spinner>
      @if (!saving) {
        <span class="fa fa-save"></span>
        } Submit
      </button>
    </form>
  }
