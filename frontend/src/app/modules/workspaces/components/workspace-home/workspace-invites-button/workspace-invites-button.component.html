<button class="btn btn-secondary btn-sm me-1" [routerLink]="['/workspaces', 'invites']">


  <span class="fa fa-envelope"></span>
  Invites

  @if (loading) {
    <span>
      (<spinner [show]="loading"></spinner>)
    </span>
  }

  @if (!loading) {
    <span>({{ invites.length || 0 }})</span>
  }
</button>
